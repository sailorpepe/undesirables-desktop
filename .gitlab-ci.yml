workflow:
  rules:
    - if: $CI_COMMIT_TAG

stages:
  - build
  - release

variables:
  NODE_VERSION: "20"
  RUST_VERSION: "1.77.2"

# ============================================================
# Linux build using mcp-dist Nuitka C-binaries
# macOS builds are done locally (GitLab free tier has no macOS runners)
# ============================================================

build:linux:
  stage: build
  image: ubuntu:22.04
  tags:
    - saas-linux-medium-amd64
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apt-get update
    - apt-get install -y curl build-essential wget git software-properties-common
    - apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
    - apt-get install -y libssl-dev pkg-config
    # Install Python 3.13 via deadsnakes PPA (Ubuntu 22.04 ships 3.10 which is too old)
    - add-apt-repository -y ppa:deadsnakes/ppa
    - apt-get update
    - apt-get install -y python3.13 python3.13-venv python3.13-dev
    # Install Node.js via nodesource
    - curl -fsSL https://deb.nodesource.com/setup_${NODE_VERSION}.x | bash -
    - apt-get install -y nodejs
  script:
    # 1. Setup Rust
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o rustup.sh
    - sh rustup.sh -y --default-toolchain $RUST_VERSION
    - source $HOME/.cargo/env

    # 2. Clone MCP server and compile proprietary modules to native C-binaries
    - git clone "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/meme-merchants/undesirables-mcp-server.git" undesirables-mcp-server
    - cd undesirables-mcp-server
    - python3.13 -m venv .venv && source .venv/bin/activate
    - pip install --upgrade pip
    - pip install nuitka ordered-set
    - pip install -r requirements.txt
    - bash compile_to_native.sh

    # 3. Assemble mcp-dist bundle (Linux .so files + entry points)
    - mkdir -p ../src-tauri/mcp-dist
    - cp *.cpython-*-linux-gnu.so ../src-tauri/mcp-dist/ 2>/dev/null || true
    - cp *.cpython-*.so ../src-tauri/mcp-dist/ 2>/dev/null || true
    - cp *.pyi ../src-tauri/mcp-dist/ 2>/dev/null || true
    - cp execute_tool.py boot_server.py boot_3d.py requirements.txt pyproject.toml ../src-tauri/mcp-dist/
    - cp -r data characters scripts ../src-tauri/mcp-dist/ 2>/dev/null || true
    - deactivate
    - cd ..

    # 4. Build Tauri App
    - npm install
    - npx tauri build

  artifacts:
    paths:
      - src-tauri/target/release/bundle/deb/*.deb
      - src-tauri/target/release/bundle/appimage/*.AppImage
    expire_in: never

# ============================================================
# GitLab Release (publishes download links)
# ============================================================
publish-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - saas-linux-small-amd64
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build:linux
      artifacts: true
  script:
    - echo "Publishing The Undesirables GUI ${CI_COMMIT_TAG}..."
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "The Undesirables GUI ${CI_COMMIT_TAG}"
    description: |
      ### 🔒 Official Release

      All AI engines compiled to native C-binaries via Nuitka.
      Fully sandboxed local execution — no cloud telemetry.

      **Downloads:**
      - Linux (x86_64): `.AppImage` portable binary + `.deb` installer

      macOS `.dmg` available in the Assets section (built and uploaded manually).
    assets:
      links:
        - name: "Linux AppImage (.AppImage)"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=build:linux"
